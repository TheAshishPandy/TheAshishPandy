name: ✨ Refresh Profile

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile activity badge
        shell: bash
        run: |
          mkdir -p assets
          python3 - <<'PY'
          import datetime
          from pathlib import Path

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0" stop-color="#06b6d4"/>
                <stop offset="0.5" stop-color="#6366f1"/>
                <stop offset="1" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
            <rect width="900" height="120" rx="22" fill="#0b1020"/>
            <rect x="1" y="1" width="898" height="118" rx="21" fill="none" stroke="url(#g)" stroke-width="2"/>
            <circle cx="48" cy="60" r="14" fill="#22c55e"/>
            <circle cx="48" cy="60" r="7" fill="#0b1020"/>
            <text x="82" y="52" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">ASHISH PANDEY • DEVELOPER RADAR</text>
            <text x="82" y="82" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">AI Engineering  •  Cloud  •  Distributed Systems  •  Developer Automation</text>
            <text x="850" y="103" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">updated {now}</text>
          </svg>'''
          Path('assets/developer-radar.svg').write_text(svg, encoding='utf-8')
          PY

      - name: Commit refreshed asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/developer-radar.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile radar"
          git push
